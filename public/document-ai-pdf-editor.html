<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--primary:#6d5dfc;--secondary:#171a2b;--success:#27ae60;--danger:#e74c3c;--bg:#0f1220;--panel:#171a2b;--text:#f4f6ff;--muted:#aab0c7;--border:#2a2f46}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.header{background:var(--secondary);padding:12px 18px;display:flex;gap:14px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}.title-area h1{font-size:18px;margin:0}.title-area p{font-size:12px;color:var(--muted);margin:3px 0 0}.toolbar-main{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid var(--border);background:#222741;color:white;padding:9px 14px;border-radius:9px;cursor:pointer}.btn.active{background:var(--primary)}.btn.success{background:var(--success)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.main-content{padding:16px}.upload-zone{border:2px dashed var(--primary);border-radius:14px;padding:34px;text-align:center;background:var(--panel);cursor:pointer}.file-input{display:none}.editor-area{display:none}.editor-area.active{display:block}.contextual-toolbar-container,.pdf-viewer{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:14px}.contextual-toolbar-container{display:none}.toolbar-contextual{display:flex;gap:8px;flex-wrap:wrap}.page-controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.page-nav,.zoom-controls{display:flex;gap:8px;align-items:center}.page-controls input,.zoom-controls select{background:#0f1220;color:white;border:1px solid var(--border);border-radius:8px;padding:7px}.canvas-wrapper{position:relative;margin:0 auto;width:fit-content;line-height:0}#pdfCanvas{display:block;max-width:100%;border:1px solid var(--border)}#overlayCanvas{position:absolute;left:0;top:0;pointer-events:none}.text-input-overlay{position:absolute;display:none;z-index:1000;background:var(--panel);padding:8px;border:1px solid var(--border);border-radius:8px}.text-input-overlay input{padding:8px;border-radius:6px;border:1px solid var(--border);margin-right:6px}.status{display:none;padding:10px;border-radius:8px;margin-bottom:10px}.status.success,.status.error{display:block}.status.success{background:#123b29}.status.error{background:#4b1f24}
</style>
</head>
<body>
<div class="header"><div class="title-area"><h1>PDF Editor</h1><p>Local, in-browser editing</p></div><div class="toolbar-main"><button class="btn" id="textBtn">Text</button><button class="btn" id="drawBtn">Draw</button><button class="btn" id="highlightBtn">Highlight</button><button class="btn" id="undoBtn" disabled>Undo</button><button class="btn" id="redoBtn" disabled>Redo</button><button class="btn danger" onclick="deletePage()">Delete Page</button><button class="btn" onclick="rotatePage()">Rotate</button><button class="btn success" onclick="downloadPDF()">Download</button><button class="btn danger" onclick="resetEditor()">Reset</button></div></div>
<div class="main-content"><div class="upload-zone" id="uploadZone"><p><strong>Drop your PDF file here</strong><br>or click to browse</p><input type="file" id="fileInput" class="file-input" accept=".pdf"></div><div class="editor-area" id="editorArea"><div class="status" id="status"></div><div class="contextual-toolbar-container" id="contextualToolbarWrapper"><div class="toolbar-contextual" id="contextualToolbar"></div></div><div class="pdf-viewer"><div class="page-controls"><div class="page-nav"><button class="btn" id="prevPageBtn" onclick="previousPage()">Previous</button><span>Page <input type="number" id="pageNum" value="1" min="1" onchange="goToPage()"> of <span id="pageCount">1</span></span><button class="btn" id="nextPageBtn" onclick="nextPage()">Next</button></div><div class="zoom-controls"><button class="btn" onclick="zoomOut()">-</button><input type="text" id="zoomPercentage" value="100%" disabled><button class="btn" onclick="zoomIn()">+</button><select id="fitModeSelect" onchange="handleFitChange()"><option value="fit-width">Fit Width</option><option value="fit-page">Fit Page</option><option value="actual">Actual Size</option></select></div></div><div class="canvas-wrapper"><canvas id="pdfCanvas"></canvas><canvas id="overlayCanvas"></canvas></div></div></div><div class="text-input-overlay" id="textInputOverlay"><input type="text" id="textInput" placeholder="Enter text..."><button class="btn" onclick="confirmAddText()">Add</button><button class="btn" onclick="cancelAddText()">Cancel</button></div></div>
<script>
const{PDFDocument,rgb,degrees}=PDFLib;let pdfDoc=null,pdfLibDoc=null,currentPage=1,totalPages=0,scale=1,currentFitMode='fit-width';let pdfCanvas,pdfCtx,overlayCanvas,overlayCtx,currentMode='none',isDrawing=false,startCoords={},drawingPoints=[];let toolSettings={textColor:'#000000',fontSize:16,drawColor:'#ff0000',lineWidth:2,highlightColor:'#ffff00'};let historyStack=[],historyIndex=-1;pdfjsLib.GlobalWorkerOptions.workerSrc=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${pdfjsLib.version}/pdf.worker.min.js`;
document.addEventListener('DOMContentLoaded',()=>{pdfCanvas=document.getElementById('pdfCanvas');pdfCtx=pdfCanvas.getContext('2d');overlayCanvas=document.getElementById('overlayCanvas');overlayCtx=overlayCanvas.getContext('2d');const up=document.getElementById('uploadZone'),fIn=document.getElementById('fileInput');up.addEventListener('click',()=>fIn.click());up.addEventListener('dragover',e=>{e.preventDefault();up.style.borderColor='#27ae60'});up.addEventListener('dragleave',()=>up.style.borderColor='');up.addEventListener('drop',e=>{e.preventDefault();up.style.borderColor='';const f=e.dataTransfer.files[0];if(f)loadPDF(f)});fIn.addEventListener('change',e=>{const f=e.target.files[0];if(f)loadPDF(f)});const vC=document.querySelector('.canvas-wrapper');vC.addEventListener('mousedown',handleMouseDown);vC.addEventListener('mousemove',handleMouseMove);vC.addEventListener('mouseup',handleMouseUp);vC.addEventListener('mouseleave',handleMouseUp);vC.addEventListener('click',handleCanvasClick);textBtn.onclick=()=>setMode('text');drawBtn.onclick=()=>setMode('draw');highlightBtn.onclick=()=>setMode('highlight');undoBtn.onclick=undo;redoBtn.onclick=redo;window.addEventListener('resize',()=>{if(pdfDoc)applyFitMode()})});
async function loadPDF(file){try{showStatus('Reading file...','success');const arrayBuffer=await file.arrayBuffer();pdfLibDoc=await PDFDocument.load(arrayBuffer);await commitState()}catch(e){showStatus('Could not load this PDF.','error');resetEditor()}}
async function renderPage(){if(!pdfDoc)return;isDrawing=false;const page=await pdfDoc.getPage(currentPage),viewport=page.getViewport({scale});pdfCanvas.height=viewport.height;pdfCanvas.width=viewport.width;overlayCanvas.height=viewport.height;overlayCanvas.width=viewport.width;await page.render({canvasContext:pdfCtx,viewport}).promise;zoomPercentage.value=`${Math.round(scale*100)}%`}
async function applyFitMode(){if(!pdfDoc)return;const page=await pdfDoc.getPage(currentPage),viewer=document.querySelector('.pdf-viewer'),viewerWidth=viewer.clientWidth-28,viewport=page.getViewport({scale:1});if(currentFitMode==='actual')scale=1;else if(currentFitMode==='fit-page')scale=Math.min(viewerWidth/viewport.width,600/viewport.height);else if(currentFitMode==='fit-width')scale=viewerWidth/viewport.width;await renderPage()}
async function updatePageUI(){if(currentPage>totalPages)currentPage=totalPages;if(currentPage<1)currentPage=1;pageNum.value=currentPage;pageCount.textContent=totalPages;prevPageBtn.disabled=currentPage<=1;nextPageBtn.disabled=currentPage>=totalPages;await applyFitMode()}
function handleFitChange(){currentFitMode=fitModeSelect.value;applyFitMode()}function zoomIn(){currentFitMode='custom';scale+=.2;renderPage()}function zoomOut(){currentFitMode='custom';scale=Math.max(.1,scale-.2);renderPage()}async function previousPage(){if(currentPage>1){currentPage--;await updatePageUI()}}async function nextPage(){if(currentPage<totalPages){currentPage++;await updatePageUI()}}async function goToPage(){const n=parseInt(pageNum.value);if(n>=1&&n<=totalPages){currentPage=n;await updatePageUI()}}
async function loadState(bytes){pdfLibDoc=await PDFDocument.load(bytes);pdfDoc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;totalPages=pdfDoc.numPages;await updatePageUI()}async function commitState(){const bytes=await pdfLibDoc.save();historyStack=historyStack.slice(0,historyIndex+1);historyStack.push(bytes);historyIndex++;updateUndoRedoButtons();pdfDoc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;totalPages=pdfDoc.numPages;if(editorArea.classList.contains('active'))await updatePageUI();else{uploadZone.style.display='none';editorArea.classList.add('active');await updatePageUI();showStatus('PDF loaded successfully!','success')}}async function undo(){if(historyIndex>1){historyIndex--;await loadState(historyStack[historyIndex-1]);updateUndoRedoButtons()}}async function redo(){if(historyIndex<historyStack.length){await loadState(historyStack[historyIndex]);historyIndex++;updateUndoRedoButtons()}}function updateUndoRedoButtons(){undoBtn.disabled=historyIndex<=1;redoBtn.disabled=historyIndex>=historyStack.length}
function setMode(mode){currentMode=currentMode===mode?'none':mode;updateToolbar()}function updateToolbar(){document.querySelectorAll('.toolbar-main .btn').forEach(b=>b.classList.remove('active'));if(currentMode!=='none')document.getElementById(`${currentMode}Btn`).classList.add('active');const w=document.querySelector('.canvas-wrapper');w.style.cursor=currentMode==='text'?'text':currentMode==='none'?'default':'crosshair';let html='';if(currentMode==='text')html=`Font Size: <input type="number" value="${toolSettings.fontSize}" onchange="toolSettings.fontSize=this.value"> Color: <input type="color" value="${toolSettings.textColor}" onchange="toolSettings.textColor=this.value">`;if(currentMode==='draw')html=`Line Width: <input type="range" min="1" max="20" value="${toolSettings.lineWidth}" onchange="toolSettings.lineWidth=this.value"> Color: <input type="color" value="${toolSettings.drawColor}" onchange="toolSettings.drawColor=this.value">`;if(currentMode==='highlight')html=`Highlight Color: <input type="color" value="${toolSettings.highlightColor}" onchange="toolSettings.highlightColor=this.value">`;contextualToolbar.innerHTML=html;contextualToolbarWrapper.style.display=html?'block':'none'}
function getMouseCoords(e){const r=e.currentTarget.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function handleMouseDown(e){if(currentMode==='none'||currentMode==='text')return;isDrawing=true;startCoords=getMouseCoords(e);drawingPoints=[startCoords];overlayCanvas.style.pointerEvents='auto'}function handleMouseMove(e){if(!isDrawing)return;const c=getMouseCoords(e);overlayCtx.clearRect(0,0,overlayCanvas.width,overlayCanvas.height);if(currentMode==='draw'){drawingPoints.push(c);overlayCtx.beginPath();overlayCtx.moveTo(drawingPoints[0].x,drawingPoints[0].y);drawingPoints.forEach(p=>overlayCtx.lineTo(p.x,p.y));overlayCtx.strokeStyle=toolSettings.drawColor;overlayCtx.lineWidth=toolSettings.lineWidth;overlayCtx.stroke()}else{overlayCtx.globalAlpha=.3;overlayCtx.fillStyle=toolSettings.highlightColor;overlayCtx.fillRect(startCoords.x,startCoords.y,c.x-startCoords.x,c.y-startCoords.y);overlayCtx.globalAlpha=1}}
async function handleMouseUp(e){if(!isDrawing)return;isDrawing=false;overlayCanvas.style.pointerEvents='none';overlayCtx.clearRect(0,0,overlayCanvas.width,overlayCanvas.height);const page=pdfLibDoc.getPage(currentPage-1),height=page.getHeight();const end=getMouseCoords(e);if(currentMode==='draw'){const path=drawingPoints.map((p,i)=>`${i===0?'M':'L'} ${p.x/scale} ${height-p.y/scale}`).join(' ');page.drawSvgPath(path,{borderColor:rgb(...hexToRgb(toolSettings.drawColor)),borderWidth:parseInt(toolSettings.lineWidth)})}else if(currentMode==='highlight'){page.drawRectangle({x:Math.min(startCoords.x,end.x)/scale,y:height-Math.max(startCoords.y,end.y)/scale,width:Math.abs(end.x-startCoords.x)/scale,height:Math.abs(end.y-startCoords.y)/scale,color:rgb(...hexToRgb(toolSettings.highlightColor)),opacity:.3})}await commitState()}
function handleCanvasClick(e){if(currentMode!=='text')return;const c=getMouseCoords(e),o=textInputOverlay;o.style.display='block';o.style.left=`${e.pageX}px`;o.style.top=`${e.pageY}px`;o.dataset.x=c.x;o.dataset.y=c.y;textInput.focus()}async function confirmAddText(){const txt=textInput.value.trim();if(!txt)return cancelAddText();const{x,y}=textInputOverlay.dataset,page=pdfLibDoc.getPage(currentPage-1);page.drawText(txt,{x:parseFloat(x)/scale,y:page.getHeight()-parseFloat(y)/scale,size:parseInt(toolSettings.fontSize),color:rgb(...hexToRgb(toolSettings.textColor))});await commitState();cancelAddText()}function cancelAddText(){textInputOverlay.style.display='none';textInput.value=''}async function deletePage(){if(totalPages<=1)return;pdfLibDoc.removePage(currentPage-1);await commitState()}async function rotatePage(){const p=pdfLibDoc.getPage(currentPage-1);p.setRotation(degrees((p.getRotation().angle+90)%360));await commitState()}async function downloadPDF(){const bytes=await pdfLibDoc.save(),blob=new Blob([bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`edited-${Date.now()}.pdf`;a.click();URL.revokeObjectURL(a.href)}function resetEditor(){editorArea.classList.remove('active');uploadZone.style.display='block';fileInput.value='';if(pdfCtx)pdfCtx.clearRect(0,0,pdfCanvas.width,pdfCanvas.height);setMode('none');historyStack=[];historyIndex=-1;hideStatus()}function hexToRgb(h){const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?[parseInt(r[1],16)/255,parseInt(r[2],16)/255,parseInt(r[3],16)/255]:[0,0,0]}function showStatus(msg,type){status.textContent=msg;status.className=`status ${type}`}function hideStatus(){status.className='status'}
</script>
</body></html>
